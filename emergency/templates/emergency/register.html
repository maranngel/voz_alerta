<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voz Alerta - Registro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent: #ffffff;
            --text-secondary: #a0a0a0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .register-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(20px);
            padding: 3rem;
            border-radius: 32px;
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h1 { font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; letter-spacing: -1px; }
        p { color: var(--text-secondary); margin-bottom: 2rem; font-size: 0.9rem; }

        form { display: flex; flex-direction: column; gap: 1rem; text-align: left; }

        .form-field { display: flex; flex-direction: column; gap: 0.4rem; }
        label { font-size: 0.8rem; color: var(--text-secondary); font-weight: 600; }

        input[type="text"], input[type="password"], input[type="email"] {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 12px;
            color: white;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: rgba(255, 255, 255, 0.4); }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-top: 0.5rem;
            background: rgba(255, 255, 255, 0.02);
            padding: 0.8rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .checkbox-group input { width: auto; }

        button {
            background: white;
            color: black;
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 1rem;
        }

        button:hover { transform: scale(1.02); background: #eee; }

        .footer-links { margin-top: 2rem; font-size: 0.85rem; color: var(--text-secondary); }
        .footer-links a { color: white; text-decoration: none; font-weight: 600; }

        .errorlist { list-style: none; color: #ff3333; font-size: 0.75rem; margin-top: 0.2rem; }
        .helptext { font-size: 0.7rem; color: #666; margin-top: 0.2rem; }
    </style>
</head>
<body>
    <div class="register-card">
        <h1>Únete a Élite</h1>
        <p>Crea tu cuenta de Voz Alerta</p>
        
        <form method="POST">
            {% csrf_token %}
            
            {% for field in form %}
                <div class="form-field {% if field.name == 'is_admin' %}checkbox-group{% endif %}">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        {{ field.errors }}
                    {% endif %}
                    {% if field.help_text %}
                        <span class="helptext">{{ field.help_text }}</span>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit">CREAR CUENTA</button>
        </form>

        <div class="footer-links">
            ¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a>
        </div>
    </div>
</body>
</html>
