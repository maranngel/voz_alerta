<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voz Alerta - Acceso</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent: #ffffff;
            --text-secondary: #a0a0a0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(20px);
            padding: 3rem;
            border-radius: 32px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 { font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; letter-spacing: -1px; }
        p { color: var(--text-secondary); margin-bottom: 2rem; font-size: 0.9rem; }

        form { display: flex; flex-direction: column; gap: 1rem; }

        input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 12px;
            color: white;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: rgba(255, 255, 255, 0.4); }

        button {
            background: white;
            color: black;
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 1rem;
        }

        button:hover { transform: scale(1.02); background: #eee; }

        .errorlist { list-style: none; color: #ff3333; font-size: 0.8rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Voz Alerta</h1>
        <p>Sistema de Gestión de Emergencias</p>
        
        <form method="POST">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <input type="text" name="username" placeholder="Usuario" required>
            <input type="password" name="password" placeholder="Contraseña" required>
            <button type="submit">INICIAR SESIÓN</button>
        </form>

        <div style="margin-top: 2rem; font-size: 0.85rem; color: var(--text-secondary);">
            ¿No tienes cuenta? <a href="{% url 'register' %}" style="color: white; text-decoration: none; font-weight: 600;">Regístrate aquí</a>
        </div>
    </div>
</body>
</html>
